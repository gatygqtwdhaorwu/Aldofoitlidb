<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | aldo footlocker</title>
<style>body{margin:0;background:#0b0b0a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#171613;border:1px solid #353027;border-radius:18px;padding:18px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.gold{color:#e7b93b}.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #302d27}.item img{width:58px;height:58px;object-fit:cover;border-radius:8px}.muted{color:#aaa;font-size:13px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #4a463e;background:#0f0f0e;color:#fff;margin-top:6px}label{font-size:13px;color:#bbb}.full{grid-column:1/-1}.pay{width:100%;border:0;border-radius:999px;background:#e7b93b;color:#111;font-weight:900;padding:14px;font-size:16px;cursor:pointer;margin-top:15px}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#e7b93b}.err{color:#ff8b8b;margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="top"><a href="index.html" style="color:#fff">← Negozio</a><b class="gold">Pagamento sicuro</b></div>
<div class="card"><h2>Il tuo ordine</h2><div id="items"></div><div class="total"><span>Totale</span><span id="total">€0,00</span></div></div>
<div class="card"><h2>Dati di consegna</h2><div class="grid">
<label>Nome<input id="name" autocomplete="name"></label><label>Email<input id="email" type="email" autocomplete="email"></label>
<label class="full">Indirizzo<input id="address" autocomplete="street-address"></label><label>Città<input id="city" autocomplete="address-level2"></label><label>CAP<input id="postal" autocomplete="postal-code"></label><label>Paese<input id="country" value="IT" autocomplete="country"></label>
</div><button id="pay" class="pay">💳 Paga con Stripe</button><div id="err" class="err"></div><p class="muted">Dopo il pagamento riceverai un numero ordine e potrai seguirne lo stato. Tempi stimati: 5–7 giorni lavorativi.</p></div>
<div class="links"><a href="tracking.html">Segui un ordine</a><a href="spedizioni.html">Spedizioni</a></div></div>
<script>
const C="aldo_footlocker_cart_v1";const fmt=c=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format((c||0)/100);let cart=[];try{cart=JSON.parse(localStorage.getItem(C)||"[]")}catch(e){}
const items=document.getElementById("items"),total=document.getElementById("total"),err=document.getElementById("err");
function render(){items.innerHTML=cart.length?cart.map(x=>`<div class="item"><img src="${x.image||""}"><div style="flex:1"><b>${String(x.title||"").replace(/[<>&"]/g,"")}</b><div class="muted">${x.qty} × ${fmt(x.unit_amount||0)}</div></div><b>${fmt((x.unit_amount||0)*x.qty)}</b></div>`).join(""):'<p class="muted">Il carrello è vuoto. Torna al negozio.</p>';total.textContent=fmt(cart.reduce((a,x)=>a+(x.unit_amount||0)*Number(x.qty||0),0));}
render();
document.getElementById("pay").onclick=async()=>{err.textContent="";if(!cart.length){err.textContent="Il carrello è vuoto.";return}
 const payload={items:cart.map(x=>({key:x.key,qty:x.qty})),customer:{name:document.getElementById("name").value,email:document.getElementById("email").value,address:document.getElementById("address").value,city:document.getElementById("city").value,postal:document.getElementById("postal").value,country:document.getElementById("country").value}};
 if(!payload.customer.name||!payload.customer.email||!payload.customer.address||!payload.customer.city||!payload.customer.postal){err.textContent="Compila tutti i dati di consegna.";return}
 const b=document.getElementById("pay");b.disabled=true;b.textContent="Apertura pagamento…";
 try{const r=await fetch("/api/create-checkout-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Errore checkout (${r.status})`);if(!d.url)throw Error("Stripe non ha restituito un URL di pagamento.");location.href=d.url}
 catch(e){err.textContent=e.message||"Errore di pagamento";b.disabled=false;b.textContent="💳 Paga con Stripe"}};
</script></body></html>
