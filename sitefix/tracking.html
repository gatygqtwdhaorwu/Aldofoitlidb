<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracking ordine | aldo footlocker</title><style>body{margin:0;background:#0b0b0a;color:#fff;font-family:Arial}.wrap{max-width:650px;margin:45px auto;padding:20px}.card{background:#171613;border:1px solid #353027;border-radius:18px;padding:22px}.row{padding:13px 0;border-bottom:1px solid #302d27}.gold{color:#e7b93b}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;background:#0f0f0e;color:#fff;border:1px solid #4a463e;margin:7px 0 12px}.btn{border:0;border-radius:999px;padding:13px 20px;background:#e7b93b;color:#111;font-weight:900}.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:18px 0}.step{height:8px;background:#39362f;border-radius:5px}.step.on{background:#e7b93b}.muted{color:#aaa}</style></head><body><div class="wrap"><div class="card"><a href="index.html" style="color:#fff">← Negozio</a><h1 class="gold">Segui il tuo ordine</h1><label>Numero ordine</label><input id="id" placeholder="es. ALD-20260905-AB12CD"><button class="btn" onclick="load()">Cerca ordine</button><div id="out"></div></div></div><script>
async function load(){const id=document.getElementById("id").value.trim(),out=document.getElementById("out");if(!id)return;out.innerHTML='<p class="muted">Caricamento…</p>';try{const r=await fetch("/api/orders/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||"Ordine non trovato");const steps=["paid","processing","shipped","delivered"],i=Math.max(0,steps.indexOf(d.status));out.innerHTML=`<div class="bar">${steps.map((s,n)=>`<div class="step ${n<=i?"on":""}"></div>`).join("")}</div><div class="row"><b>Stato:</b> ${label(d.status)}</div><div class="row"><b>Ordine:</b> ${d.orderId}</div><div class="row"><b>Totale:</b> ${d.total}</div><div class="row"><b>Consegna stimata:</b> 5–7 giorni lavorativi</div>`}catch(e){out.innerHTML='<p style="color:#ff8b8b">'+e.message+'</p>'}}
function label(s){return ({paid:"Pagamento ricevuto",processing:"In preparazione",shipped:"Spedito",delivered:"Consegnato",pending:"In attesa di pagamento"})[s]||s}
const q=new URLSearchParams(location.search).get("id");if(q){document.getElementById("id").value=q;load()}
</script></body></html>
