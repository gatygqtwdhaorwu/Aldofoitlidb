<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordine confermato | aldo footlocker</title><style>body{margin:0;background:#0b0b0a;color:#fff;font-family:Arial}.wrap{max-width:650px;margin:60px auto;padding:20px}.card{background:#171613;border:1px solid #353027;border-radius:20px;padding:28px;text-align:center}.ok{font-size:55px}.gold{color:#e7b93b}.track{display:inline-block;margin-top:18px;padding:13px 22px;background:#e7b93b;color:#111;text-decoration:none;border-radius:999px;font-weight:900}</style></head><body><div class="wrap"><div class="card"><div class="ok">✓</div><h1 class="gold">Pagamento completato</h1><p id="msg">Verifica dell'ordine in corso…</p><div id="order"></div><a class="track" href="tracking.html">Segui il tuo ordine</a><p><a href="index.html" style="color:#e7b93b">Torna al negozio</a></p></div></div><script>

</script></body></html>
